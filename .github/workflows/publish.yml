# Publishes to the VS Code Marketplace when a version tag (v1.2.3) is pushed.
# Needs repo secret VSCE_PAT (Azure DevOps token with Marketplace > Manage scope).
name: Publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run test:unit
      - run: npx @vscode/vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
